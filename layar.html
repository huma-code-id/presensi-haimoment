<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layar Sambutan - HaiMoment</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --gold: #e9c98b; --ink: #fdfaf3; --muted: rgba(253, 250, 243, .72); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; color: var(--ink); font-family: 'Inter', sans-serif; }
  #bg { position: fixed; inset: 0; background: radial-gradient(ellipse at top, #4a3526 0%, #1a1410 70%); background-size: cover; background-position: center; }
  #bg.photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 8, 6, .55) 0%, rgba(10, 8, 6, .78) 100%); }
  .stage { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 3vh 4vw; }
  header { text-align: center; }
  .judul { font-family: 'Great Vibes', cursive; font-size: clamp(40px, 7vw, 110px); color: var(--gold); line-height: 1.1; text-shadow: 0 2px 20px rgba(0, 0, 0, .4); }
  .sub { font-size: clamp(13px, 1.5vw, 22px); letter-spacing: .25em; text-transform: uppercase; color: var(--muted); margin-top: .6vh; }
  main { display: grid; grid-template-columns: 1fr minmax(240px, 26vw); gap: 3vw; align-items: center; min-height: 0; }
  .welcome { text-align: center; }
  .card { opacity: 0; transform: translateY(24px) scale(.97); transition: opacity .7s ease, transform .7s ease; }
  .card.show { opacity: 1; transform: none; }
  .sd { font-family: 'Great Vibes', cursive; font-size: clamp(34px, 5vw, 80px); color: var(--gold); }
  .nama { font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(36px, 6.5vw, 120px); line-height: 1.12; margin: 1vh 0; word-break: break-word; }
  .ket { font-size: clamp(16px, 2vw, 30px); color: var(--muted); }
  .pax { display: inline-block; margin-top: 2vh; padding: .5vh 1.4vw; border: 1px solid rgba(233, 201, 139, .5); border-radius: 999px; color: var(--gold); font-size: clamp(14px, 1.6vw, 24px); }
  .idle .nama { font-size: clamp(30px, 4.5vw, 80px); }
  aside { background: rgba(0, 0, 0, .28); border: 1px solid rgba(233, 201, 139, .18); border-radius: 18px; padding: 2vh 1.4vw; max-height: 62vh; overflow: hidden; backdrop-filter: blur(4px); }
  aside h3 { margin: 0 0 1.4vh; font-weight: 600; font-size: clamp(12px, 1.1vw, 17px); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
  #recent { list-style: none; margin: 0; padding: 0; }
  #recent li { padding: 1.1vh 0; border-top: 1px solid rgba(253, 250, 243, .1); animation: slide .6s ease; }
  #recent li:first-child { border-top: 0; }
  #recent .n { font-weight: 600; font-size: clamp(14px, 1.35vw, 22px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #recent .t { font-size: clamp(11px, .95vw, 15px); color: var(--muted); }
  @keyframes slide { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  footer { display: flex; justify-content: space-between; align-items: center; font-size: clamp(12px, 1.2vw, 18px); color: var(--muted); }
  .stat b { color: var(--gold); font-size: 1.35em; }
  .brand { display: flex; align-items: center; gap: .6vw; }
  .brand img { height: clamp(22px, 2.6vw, 40px); }
  #fs { position: fixed; top: 12px; right: 12px; background: rgba(0, 0, 0, .35); color: var(--ink); border: 1px solid rgba(255, 255, 255, .2); border-radius: 8px; padding: 6px 12px; font: 500 12px 'Inter', sans-serif; cursor: pointer; opacity: .5; }
  #fs:hover { opacity: 1; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 18px; background: #1a1410; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<div id="bg"></div>
<div class="stage">
  <header>
    <div class="judul" id="judul">&nbsp;</div>
    <div class="sub" id="sub"></div>
  </header>
  <main>
    <div class="welcome">
      <div class="card idle show" id="card">
        <div class="sd">Selamat Datang</div>
        <div class="nama" id="cNama">Tamu Undangan</div>
        <div class="ket" id="cKet">Terima kasih atas kehadiran Anda</div>
        <div class="pax" id="cPax" style="display:none"></div>
      </div>
    </div>
    <aside>
      <h3>Baru Saja Hadir</h3>
      <ul id="recent"></ul>
    </aside>
  </main>
  <footer>
    <div class="stat">Tamu hadir: <b id="sHadir">0</b> undangan · <b id="sOrang">0</b> orang</div>
    <div class="brand"><img src="logo.png" alt=""><span>HaiMoment</span></div>
  </footer>
</div>
<button id="fs">⛶ Layar penuh</button>
<div id="err"></div>

<script>
(function() {
  'use strict';
  const $ = function(id) { return document.getElementById(id); };
  const P = new URLSearchParams(location.search);
  const KEY = P.get('k') || '';
  const API = P.get('api') || 'https://script.google.com/macros/s/AKfycbxtaeNS5hc3PEGmX7cjoM4Aa6HWpyPZLrxXKJVlmfvrfTJPcE0MskIc-Zop03eLvcH-0g/exec';
  const SHOW_MS = 7000, SHOW_MS_BUSY = 4000;
  let seq = 0, queue = [], showing = false, recent = [], started = false, lastStats = 0;

  async function call(fn, args) {
    const url = API + '?api=' + fn + '&d=' + encodeURIComponent(JSON.stringify(args)) + '&_=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' });
    return r.json();
  }

  function fail(msg) { $('err').innerText = msg; $('err').style.display = 'flex'; }

  function applyInfo(info) {
    if (!info) return;
    $('judul').innerText = info.judul || 'Selamat Datang';
    $('sub').innerText = [info.hariTanggal, info.tempat].filter(Boolean).join('  ·  ');
    document.title = (info.judul ? info.judul + ' - ' : '') + 'Layar Sambutan';
    if (info.foto) { $('bg').style.backgroundImage = 'url("' + info.foto.replace(/"/g, '%22') + '")'; $('bg').classList.add('photo'); }
    else { $('bg').style.backgroundImage = ''; $('bg').classList.remove('photo'); }
  }

  function jam(ts) { const m = String(ts || '').match(/(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + '.' + m[2] : ''; }

  function addRecent(it) {
    recent.unshift(it);
    recent = recent.slice(0, 10);
    $('recent').innerHTML = recent.map(function(x) {
      const esc = function(s) { const d = document.createElement('div'); d.innerText = s || ''; return d.innerHTML; };
      return '<li><div class="n">' + esc(x.nama) + '</div><div class="t">' + jam(x.t) + (x.ket ? ' · ' + esc(x.ket) : '') + '</div></li>';
    }).join('');
  }

  function setCard(it) {
    const card = $('card');
    card.classList.remove('show');
    setTimeout(function() {
      if (it) {
        card.classList.remove('idle');
        $('cNama').innerText = it.nama;
        $('cKet').innerText = it.ket || '';
        $('cPax').style.display = it.pax > 1 ? 'inline-block' : 'none';
        $('cPax').innerText = it.pax + ' orang';
      } else {
        card.classList.add('idle');
        $('cNama').innerText = 'Tamu Undangan';
        $('cKet').innerText = 'Terima kasih atas kehadiran Anda';
        $('cPax').style.display = 'none';
      }
      card.classList.add('show');
    }, 450);
  }

  // Tampilkan antrean satu per satu; kalau ramai, durasi per tamu dipersingkat
  function next() {
    if (!queue.length) { showing = false; setCard(null); return; }
    showing = true;
    const it = queue.shift();
    setCard(it);
    addRecent(it);
    setTimeout(next, queue.length ? SHOW_MS_BUSY : SHOW_MS);
  }

  let inFlight = false;
  async function poll() {
    if (inFlight) return; // Apps Script kadang lambat >3 detik — cegah permintaan bertumpuk (sambutan dobel)
    inFlight = true;
    const withStats = !started || Date.now() - lastStats > 30000;
    try {
      const res = await call('layarFeed', [KEY, seq, withStats]);
      if (!res.success) { if (res.invalidLink || !started) fail(res.message || 'Link layar tidak valid'); return; }
      $('err').style.display = 'none';
      if (withStats) {
        lastStats = Date.now();
        applyInfo(res.info);
        if (res.stats) { $('sHadir').innerText = res.stats.hadir; $('sOrang').innerText = res.stats.orang; }
      }
      if (!started) {
        // Saat layar baru dibuka: isi daftar "baru saja hadir", jangan putar ulang sambutan lama
        (res.recent || []).forEach(addRecent);
        seq = res.seq; started = true;
        return;
      }
      if (res.items.length) {
        res.items.forEach(function(it) { queue.push(it); });
        seq = res.seq;
        $('sHadir').innerText = (parseInt($('sHadir').innerText, 10) || 0) + res.items.length;
        $('sOrang').innerText = (parseInt($('sOrang').innerText, 10) || 0) + res.items.reduce(function(n, x) { return n + (x.pax || 1); }, 0);
        if (!showing) next();
      }
    } catch (e) { /* jaringan putus sesaat — coba lagi di polling berikutnya */ }
    finally { inFlight = false; }
  }

  $('fs').addEventListener('click', function() {
    const el = document.documentElement;
    if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || function() {}).call(el);
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', function() { $('fs').style.display = document.fullscreenElement ? 'none' : ''; });

  if (!KEY) { fail('Link layar tidak lengkap. Buka dari menu Presensi Tamu di aplikasi HaiMoment.'); return; }
  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
